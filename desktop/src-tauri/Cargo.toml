[package]
name = "rudy-browser-desktop"
version = "0.1.3"
description = "Rudy Browser desktop application"
authors = ["RudyCity"]
edition = "2021"

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = { version = "=2.12.7", features = ["unstable"] }
serde_json = "1"
url = "2"
# The download manager streams response bodies itself, and the TLS backend is
# needed because sites serve downloads over HTTPS. native-tls is used so the
# build does not pull in a second TLS stack on top of the platform one.
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls"] }
