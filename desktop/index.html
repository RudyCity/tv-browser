<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Rudy Browser</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main class="browser">
    <header class="toolbar" aria-label="Browser controls">
      <button id="back" class="nav-button" aria-label="Back" title="Back" disabled>←</button>
      <button id="forward" class="nav-button" aria-label="Forward" title="Forward" disabled>→</button>
      <button id="reload" class="nav-button" aria-label="Reload" title="Reload">↻</button>
      <form id="navigate" class="address-form">
        <input id="address" type="text" inputmode="url" autocomplete="url"
          spellcheck="false" placeholder="Search or enter address" aria-label="Address" />
        <button type="submit" class="go-button">Go</button>
      </form>
      <button id="home" class="nav-button" aria-label="Home" title="Home">⌂</button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="bookmark-toggle" class="utility-button" aria-label="Bookmark this page"
        title="Bookmark this page" aria-pressed="false" disabled>☆</button>
      <button id="bookmarks" class="utility-button" aria-label="Open bookmarks"
        title="Bookmarks (Ctrl+B)">★</button>
      <button id="history" class="utility-button" aria-label="Open history"
        title="History (Ctrl+H)">◷</button>
      <button id="downloads" class="utility-button" aria-label="Open downloads"
        title="Downloads (Ctrl+J)">↓</button>
    </header>

    <section class="welcome" id="welcome" aria-label="Rudy Browser home">
      <div class="home-content" id="home-content">
        <div class="home-hero">
          <div class="brand-mark">R</div>
          <p class="eyebrow">RUDY BROWSER DESKTOP</p>
          <h1>Your web, your way.</h1>
          <p class="subtitle">A focused browsing space across your devices.</p>
          <form id="home-search" class="home-search">
            <input id="home-address" type="text" placeholder="Search the web or enter a URL"
              aria-label="Search the web or enter a URL" />
            <button type="submit">Explore</button>
          </form>
        </div>

        <div class="home-dashboard">
          <section class="dashboard-card" aria-labelledby="home-bookmarks-heading">
            <div class="dashboard-heading">
              <div>
                <p class="eyebrow">SAVED FOR LATER</p>
                <h2 id="home-bookmarks-heading">Bookmarks</h2>
              </div>
              <button id="show-bookmarks" class="text-button" type="button">View all</button>
            </div>
            <div id="home-bookmarks" class="dashboard-list"></div>
          </section>

          <section class="dashboard-card" aria-labelledby="home-history-heading">
            <div class="dashboard-heading">
              <div>
                <p class="eyebrow">PICK UP WHERE YOU LEFT OFF</p>
                <h2 id="home-history-heading">Recent pages</h2>
              </div>
              <button id="show-history" class="text-button" type="button">View all</button>
            </div>
            <div id="home-recent" class="dashboard-list"></div>
          </section>
        </div>
        <p class="home-hint">Tip: use Ctrl+L to focus the address bar, Ctrl+D to save a page.</p>
      </div>

      <section id="library-view" class="library-view" aria-live="polite" hidden>
        <header class="library-header">
          <div>
            <p class="eyebrow">YOUR BROWSER DATA</p>
            <h2 id="library-title">Bookmarks</h2>
          </div>
          <button id="library-close" type="button">Home</button>
        </header>
        <div class="library-toolbar">
          <input id="library-filter" type="search" placeholder="Filter by title or address"
            aria-label="Filter browser data" />
          <button id="library-clear" type="button" class="danger-button" hidden>Clear history</button>
        </div>
        <div id="library-items" class="library-items"></div>
        <p id="library-empty" class="empty-state" hidden>Nothing here yet.</p>
      </section>
    </section>

    <footer class="status" id="status" role="status" aria-live="polite">Ready</footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
