plugins {
    id 'com.android.application'
}

def embeddedChromiumAar = file('libs/chromium-engine.aar')

android {
    namespace 'io.rudycity.tvbrowser'
    compileSdk rootProject.hasProperty('geckoModernBuild') ? 37 : 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'io.rudycity.tvbrowser'
        minSdk 19
        targetSdk 28
        versionCode 12
        versionName '0.8.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        manifestPlaceholders = [browserLabel: '@string/app_name', cleartextPolicy: 'true']
    }

    flavorDimensions 'renderer'
    productFlavors {
        legacy {
            dimension 'renderer'
            minSdk 19
        }
        // Distinct installable debug package, preserving existing user's legacy browser.
        // Never use this ID for a production Play Store release.
        preview {
            dimension 'renderer'
            minSdk 21
            testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
            applicationIdSuffix '.previewcompose071'
            versionNameSuffix '-preview'
            manifestPlaceholders = [browserLabel: '@string/app_name_preview', cleartextPolicy: 'false']
        }
        // Separate installable flavor: current GeckoView needs API 26+.
        // Legacy API19 and Preview API21 remain System WebView builds.
        gecko {
            dimension 'renderer'
            minSdk 26
            // Android API 36 target for modern phone/tablet distribution.
            // Legacy/Compose Preview keep existing target and compatibility.
            targetSdk 36
            applicationIdSuffix '.gecko159'
            versionNameSuffix '-gecko'
            testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
            manifestPlaceholders = [browserLabel: '@string/app_name', cleartextPolicy: 'false']
        }
        chromium {
            dimension 'renderer'
            minSdk 29
            manifestPlaceholders = [browserLabel: '@string/app_name', cleartextPolicy: 'false']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Prevent a Chromium-branded variant without a real standalone Chromium embedder.
androidComponents {
    beforeVariants(selector().withFlavor('renderer', 'chromium')) { variant ->
        variant.enable = embeddedChromiumAar.isFile()
    }
}

dependencies {
    implementation project(':engine-api')
    // ComponentActivity installs ViewTreeLifecycleOwner needed by ComposeView.
    // AndroidX Activity 1.9.3 continues to support legacy Android API 19.
    implementation 'androidx.activity:activity:1.9.3'
    previewImplementation project(':compose-ui')
    geckoImplementation project(':compose-ui')
    geckoImplementation project(':engine-gecko')
    chromiumImplementation project(':compose-ui')
    if (embeddedChromiumAar.isFile()) {
        chromiumImplementation files(embeddedChromiumAar)
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

tasks.register('validateEmbeddedChromium', Exec) {
    onlyIf { embeddedChromiumAar.isFile() }
    commandLine 'python3', rootProject.file('scripts/check_chromium_aar.py'), embeddedChromiumAar
}
// Validate even when users invoke assembleChromiumDebug directly.
tasks.matching { it.name.startsWith('preChromium') && it.name.endsWith('Build') }.configureEach {
    dependsOn tasks.named('validateEmbeddedChromium')
}

/**
 * AndroidX Activity 1.9.x can pull legacy jdk7/jdk8 stdlib artifacts. Kotlin
 * 2.1.20 consolidates these classes in kotlin-stdlib, so align all three
 * artifacts across BOTH legacy and modern variants to avoid duplicate DEX.
 */
configurations.configureEach {
    // Keep exact old APK toolchain reproducible; modern Gecko uses its own
    // Android Gradle 9.1 build root and newer compatible Kotlin dependency graph.
    def kotlinVersion = rootProject.hasProperty('geckoModernBuild') ? '2.2.10' : '2.1.20'
    resolutionStrategy.force(
            "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kotlinVersion}",
            "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlinVersion}")
}
