<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="45%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Radial Stage Light behind Logo -->
    <radialGradient id="stageGlow" cx="28%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid / Starfield Mesh -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Squircle Gradient -->
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <linearGradient id="sqRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="18%" stop-color="#bae6fd"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="legGrad" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="ribbonShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#010409" flood-opacity="0.85"/>
    </filter>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="url(#tvBg)"/>
  <rect width="1920" height="1080" fill="url(#stageGlow)"/>

  <!-- Left: Glowing Master Emblem -->
  <g transform="translate(240, 260) scale(1.1)" filter="url(#logoShadow)">
    <!-- Squircle container (512x512) -->
    <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#sqBg)"/>
    <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="none" stroke="url(#sqRim)" stroke-width="2.5"/>

    <!-- Pillar -->
    <rect x="136" y="124" width="60" height="264" rx="30" ry="30" fill="url(#ribbonGrad)"/>

    <!-- Leg -->
    <path d="M 196 244
             L 264 244
             C 288 244 310 258 322 280
             L 374 366
             C 382 378 372 388 358 388
             L 300 388
             C 282 388 266 376 256 360
             L 208 280
             C 202 270 196 258 196 244 Z"
          fill="url(#legGrad)"/>

    <!-- Loop -->
    <path d="M 166 124
             L 272 124
             C 338 124 386 170 386 228
             C 386 286 338 332 272 332
             L 196 332
             C 179 332 166 319 166 302
             L 166 288
             C 166 271 179 258 196 258
             L 264 258
             C 292 258 316 242 316 228
             C 316 214 292 198 264 198
             L 166 198 Z"
          fill="url(#ribbonGrad)"
          filter="url(#ribbonShadow)"/>

    <!-- Specular Highlight -->
    <path d="M 166 126
             L 272 126
             C 334 126 382 170 384 226"
          fill="none"
          stroke="url(#specularGrad)"
          stroke-width="3.5"
          stroke-linecap="round"/>
  </g>

  <!-- Right: Flagship TV Typography -->
  <g transform="translate(860, 360)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="42" rx="21" ry="21" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="110" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">SMART TV EDITION</text>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="94" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">RUDY BROWSER</text>

    <!-- Subtitle / Value Prop -->
    <text x="4" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" letter-spacing="0.5">High-Performance Minimalist Web Engine for Television</text>

    <!-- Feature Dots -->
    <g transform="translate(4, 275)">
      <circle cx="6" cy="0" r="5" fill="#38bdf8"/>
      <text x="24" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#cbd5e1" letter-spacing="1">ULTRA FAST</text>

      <circle cx="210" cy="0" r="5" fill="#38bdf8"/>
      <text x="228" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#cbd5e1" letter-spacing="1">SECURE &amp; PRIVATE</text>

      <circle cx="490" cy="0" r="5" fill="#38bdf8"/>
      <text x="508" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#cbd5e1" letter-spacing="1">DPAD OPTIMIZED</text>
    </g>
  </g>
</svg>
