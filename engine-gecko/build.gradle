plugins {
    id 'com.android.library'
}

android {
    namespace 'io.rudycity.tvbrowser.gecko'
    compileSdk 35
    defaultConfig { minSdk 26 }
    compileOptions {
        // Mozilla's current GeckoView consumer guide requires Java 17.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':engine-api')
    // Pinned, stable Mozilla AAR published 2026-11-03; not a mock WebView renderer.
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261102144711'
}
