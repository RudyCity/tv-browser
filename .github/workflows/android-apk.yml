name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify pure Java engine policy
        run: bash scripts/test-policy.sh
      - name: Test Kotlin Compose UI and legacy/modern Android variants
        run: gradle --no-daemon :compose-ui:testDebugUnitTest testLegacyDebugUnitTest testPreviewDebugUnitTest assembleLegacyDebug assemblePreviewDebug
      - name: Verify APK signatures and distinct application IDs
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          LEGACY="app/build/outputs/apk/legacy/debug/app-legacy-debug.apk"
          PREVIEW="app/build/outputs/apk/preview/debug/app-preview-debug.apk"
          "$APKSIGNER" verify --verbose "$LEGACY"
          "$APKSIGNER" verify --verbose "$PREVIEW"
          "$AAPT" dump badging "$LEGACY" | grep -F "package: name='io.rudycity.tvbrowser' "
          "$AAPT" dump badging "$PREVIEW" | grep -F "package: name='io.rudycity.tvbrowser.previewcompose071' "
          "$AAPT" dump badging "$PREVIEW" | grep -F "application-label:'Rudy Browser Compose 0.7.1'"
          # Legacy Android TV intentionally allows HTTP; modern Preview must forbid it.
          "$AAPT" dump xmltree "$LEGACY" AndroidManifest.xml | grep -E 'usesCleartextTraffic.*0xffffffff'
          "$AAPT" dump xmltree "$PREVIEW" AndroidManifest.xml | grep -E 'usesCleartextTraffic.*0x0([^a-fA-F0-9]|$)'
          sha256sum "$LEGACY" "$PREVIEW"
      - name: Upload legacy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-legacy-debug-apk
          path: app/build/outputs/apk/legacy/debug/app-legacy-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload clean-install Preview debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-preview-installable-apk
          path: app/build/outputs/apk/preview/debug/app-preview-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify embedded Chromium package
        if: ${{ hashFiles('app/libs/chromium-engine.aar') != '' }}
        run: python3 scripts/check_chromium_aar.py app/libs/chromium-engine.aar
      - name: Build standalone Chromium variant
        if: ${{ hashFiles('app/libs/chromium-engine.aar') != '' }}
        run: gradle --no-daemon testChromiumDebugUnitTest assembleChromiumDebug
      - name: Upload Chromium debug APK
        if: ${{ hashFiles('app/libs/chromium-engine.aar') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-chromium-debug-apk
          path: app/build/outputs/apk/chromium/debug/app-chromium-debug.apk
          if-no-files-found: error
          retention-days: 14
