name: Android GeckoView Preview
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine-api/**'
      - 'engine-gecko/**'
      - 'compose-ui/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/package_gecko_abis.py'
      - 'scripts/tests/test_gecko_abi_packaging.py'
      - '.github/workflows/android-gecko.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'engine-api/**'
      - 'engine-gecko/**'
      - 'compose-ui/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/package_gecko_abis.py'
      - 'scripts/tests/test_gecko_abi_packaging.py'
      - '.github/workflows/android-gecko.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gecko-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 17 SDK from preview channel
        run: |
          sdkmanager --list --channel=3 | grep -E 'platforms;android-37|platforms;android-CinnamonBun' || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Test strict ABI packaging policy
        run: python3 -m unittest discover -s scripts/tests -p test_gecko_abi_packaging.py
      - name: Compile real GeckoView and build per-ABI debug APKs
        run: gradle -p gecko-build --no-daemon -PrudyGeckoAbiSplits=true :app:testGeckoDebugUnitTest :app:assembleGeckoDebug :engine-gecko:assembleDebug
      - name: Reject universal or mixed-native-ABI output
        run: |
          set -euo pipefail
          python3 scripts/package_gecko_abis.py \
            --input app/build/outputs/apk/gecko/debug \
            --output dist/gecko
      - name: Verify signatures, package IDs and security policy for each ABI
        run: |
          set -euo pipefail
          for APK in dist/gecko/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='io.rudycity.tvbrowser.gecko159' "
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "targetSdkVersion:'36'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='12' versionName='0.8.0-gecko'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E 'usesCleartextTraffic.*0x0([^a-fA-F0-9]|$)'
            sha256sum "$APK"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-gecko-abi-apks
          path: dist/gecko/*.apk
          if-no-files-found: error
          retention-days: 14
  gecko-api29-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android 17 SDK from preview channel
        run: |
          sdkmanager --list --channel=3 | grep -E 'platforms;android-37|platforms;android-CinnamonBun' || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: API29 real Gecko launch, navigation and renderer smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            gradle -p gecko-build --no-daemon connectedGeckoDebugAndroidTest
            adb install -r app/build/outputs/apk/gecko/debug/app-gecko-debug.apk
            adb shell am start -W -n io.rudycity.tvbrowser.gecko159/io.rudycity.tvbrowser.MainActivity
            sleep 5
            adb shell pidof io.rudycity.tvbrowser.gecko159
            adb shell dumpsys activity activities > app/build/gecko-foreground.txt
            grep -E 'mResumedActivity:.*io.rudycity.tvbrowser.gecko159' app/build/gecko-foreground.txt
            mkdir -p app/build/reports/gecko
            adb exec-out screencap -p > app/build/reports/gecko/gecko-startup.png
            test -s app/build/reports/gecko/gecko-startup.png
      - name: Preserve emulator and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-gecko-api29-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/gecko/
            app/build/gecko-foreground.txt
          if-no-files-found: ignore
          retention-days: 14
