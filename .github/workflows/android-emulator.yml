name: Android Compose Emulator Smoke
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'compose-ui/**'
      - 'engine-api/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'compose-ui/**'
      - 'engine-api/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android29-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Configure Java and Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable Android emulator virtualization
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot API 29 and run Preview activity smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon connectedPreviewDebugAndroidTest
      - name: Preserve instrumentation XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-api29-instrumentation-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
