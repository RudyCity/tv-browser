name: Android Compose Emulator Smoke
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'compose-ui/**'
      - 'engine-api/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'compose-ui/**'
      - 'engine-api/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android29-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Configure Java and Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable Android emulator virtualization
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot API 29 and run Preview activity smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            gradle --no-daemon connectedPreviewDebugAndroidTest
            # connectedAndroidTest removes the target app when the test runner exits.
            # Reinstall before attempting a *standalone* runtime screenshot.
            adb install -r app/build/outputs/apk/preview/debug/app-preview-debug.apk
            adb shell am start -W -n io.rudycity.tvbrowser.previewcompose071/io.rudycity.tvbrowser.MainActivity
            sleep 4
            # Fail the workflow if the browser is not actually resumed/foreground.
            adb shell pidof io.rudycity.tvbrowser.previewcompose071
            mkdir -p app/build/reports/emulator
            # Collect actual API29 startup memory and frame-stat evidence.
            adb shell dumpsys meminfo io.rudycity.tvbrowser.previewcompose071 > app/build/reports/emulator/meminfo.txt
            adb shell dumpsys gfxinfo io.rudycity.tvbrowser.previewcompose071 > app/build/reports/emulator/gfxinfo.txt
            test -s app/build/reports/emulator/meminfo.txt
            test -s app/build/reports/emulator/gfxinfo.txt
            adb shell dumpsys activity activities > app/build/activity-after-launch.txt
            grep -E 'mResumedActivity:.*io.rudycity.tvbrowser.previewcompose071' app/build/activity-after-launch.txt
            mkdir -p app/build/reports/emulator
            adb exec-out screencap -p > app/build/reports/emulator/compose-startup.png
            test -s app/build/reports/emulator/compose-startup.png
            cp app/build/activity-after-launch.txt app/build/reports/emulator/activity-after-launch.txt
      - name: Preserve instrumentation XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-api29-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/emulator/
          if-no-files-found: ignore
          retention-days: 14
