name: Desktop builds

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            args: "--win nsis portable"
            artifact: "desktop/release/*.exe"
          - platform: Linux
            os: ubuntu-22.04
            args: "--linux AppImage deb"
            artifact: "desktop/release/*"
          - platform: macOS
            os: macos-latest
            args: "--mac dmg zip"
            artifact: "desktop/release/*"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnss3 libxss1 libasound2 libxtst6 libatspi2.0-0 libuuid1 fakeroot rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Validate JavaScript syntax and navigation policy
        working-directory: desktop
        run: |
          node --check main.cjs
          node --check src/main.js
          node --check src/navigation.js
          npm test
      - name: Build platform installers
        working-directory: desktop
        run: npm run dist -- ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
