name: Desktop builds (Rust + Tauri)

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            bundles: "nsis,msi"
          - platform: Linux
            os: ubuntu-22.04
            bundles: "appimage,deb"
          - platform: macOS
            os: macos-latest
            bundles: "dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Generate desktop application icons
        working-directory: desktop
        run: bun run tauri -- icon ../art/rudy_browser_mark.svg

      - name: Run JavaScript tests
        working-directory: desktop
        run: bun run test

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust unit and integration tests
        working-directory: desktop/src-tauri
        run: cargo test --all-targets --all-features

      - name: Run Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build frontend assets
        working-directory: desktop
        run: bun run build

      - name: Build native Tauri installers
        working-directory: desktop
        run: bun run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-${{ matrix.platform }}-tauri-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish-desktop-release:
    name: Publish Rudy Browser Desktop preview
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(desktop):') }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: rudy-browser-*-tauri-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(bun -p 'require("./desktop/src-tauri/tauri.conf.json").version')"
          tag="desktop-v${version}"
          title="Rudy Browser Desktop v${version} (Preview)"

          mapfile -d '' installer_files < <(
            find release-assets -type f \
              \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.appimage' -o -iname '*.deb' -o -iname '*.dmg' \) \
              -print0 | sort -z
          )

          if (( ${#installer_files[@]} < 5 )); then
            printf 'Expected five or more platform installer files; found %s\n' "${#installer_files[@]}" >&2
            find release-assets -type f -print >&2
            exit 1
          fi

          (
            cd release-assets
            find . -type f \
              \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.appimage' -o -iname '*.deb' -o -iname '*.dmg' \) \
              -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          installer_files+=(release-assets/SHA256SUMS.txt)

          notes="$(cat <<EOF
          ## Rudy Browser Desktop v${version} — Preview

          Cross-platform preview using native operating-system webviews:
          - **Windows:** NSIS installer (.exe) and MSI; WebView2 runtime required.
          - **Linux:** AppImage and DEB; WebKitGTK 4.1 runtime required.
          - **macOS:** DMG; uses the native WKWebView engine.

          Bookmarks, searchable history, tabs with session restore, page zoom, find in page,
          dark/light themes, an English and Indonesian interface, downloads with progress,
          pause, resume and cancel, and a per-origin permission allow-list are included in this preview.
          \`SHA256SUMS.txt\` contains SHA-256 checksums for all installer packages.

          ### Preview limitations
          - Extensions, ad/tracker filtering, multiple native windows, a permission prompt that blocks the request while the user decides, and an in-app updater are not implemented.
          - Installers are currently unsigned. The macOS app is not notarized, so Gatekeeper may warn or block it.
          - The browser uses the operating system's WebView runtime; engine versions and behavior follow the installed OS runtime.
          EOF
          )"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${installer_files[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" "${installer_files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
