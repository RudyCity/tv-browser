name: Desktop builds (Rust + Tauri)

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            bundles: "nsis,msi"
          - platform: Linux
            os: ubuntu-22.04
            bundles: "appimage,deb"
          - platform: macOS
            os: macos-latest
            bundles: "dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Run JavaScript navigation tests
        working-directory: desktop
        run: npm test

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust unit and integration tests
        working-directory: desktop/src-tauri
        run: cargo test --all-targets --all-features

      - name: Run Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build frontend assets
        working-directory: desktop
        run: npm run build

      - name: Build native Tauri installers
        working-directory: desktop
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: rudy-browser-${{ matrix.platform }}-tauri-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
