pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Official Mozilla Maven hosts pinned GeckoView release AARs.
        maven { url 'https://maven.mozilla.org/maven2/' }
    }
}
rootProject.name = 'rudy-browser'
include ':app', ':engine-api', ':compose-ui', ':engine-gecko'
